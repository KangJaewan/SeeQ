<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeeQ Mate - 홈</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Sniglet:wght@400&family=Space+Grotesk:wght@500&family=Inter:wght@400&family=Noto+Sans+SC:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="layout">
        <!-- Main Content -->
        <div class="main-content">
            <!-- Dynamic Video Banner Section -->
            <div class="video-banner-section">
                <div class="video-banner-container">
                    <video class="banner-video" autoplay muted>
                        <source src="banner_video.mp4" type="video/mp4">
                        <!-- 영상 파일이 없을 경우 대체 이미지 -->
                        <div class="video-fallback">
                            <div class="fallback-content">
                                <h2>SeeQ Mate와 함께하는 스마트한 문서 관리</h2>
                                <p>AI 기반 문서 분석으로 더 효율적인 업무를 경험하세요</p>
                            </div>
                        </div>
                </div>
            </div>
            
            <header class="header">
                <div class="welcome-message">Hello 수림 👋🏼</div>
                <div class="user-greeting-search">
                    <div class="search-container">
                        <svg class="search-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5A6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        <input type="text" class="search-input" placeholder="Search...">
                    </div>
                    <button class="dark-mode-toggle" onclick="toggleDarkMode()" title="다크 모드 전환">
                        <svg class="dark-mode-icon light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="dark-mode-icon dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
            </header>

            <div class="content-area">
                <!-- Library Section and User Box -->
                <div class="top-section">
                    <!-- Unified Library Section -->
                <div class="library-section-main">
                    <div class="library-header-main">
                        <div class="library-title-main">
                            <div class="library-icon-main"></div>
                            <span class="library-text">라이브러리</span>
                        </div>
                            <div class="library-controls">
                                <button class="add-category-btn" onclick="addNewCategory()">+ 카테고리 추가</button>
                        <button class="sort-button">
                            <span>최신순</span>
                            <div class="chevron-icon"></div>
                        </button>
                            </div>
                        </div>

                        <!-- Category Tabs -->
                        <div class="category-tabs-container">
                            <!-- 동적으로 생성될 카테고리 탭들 -->
                    </div>

                    <div class="library-with-trash">
                        <div class="library-grid-container">
                                <div class="library-grid" id="unified-library-grid">
                                    <!-- 선택된 카테고리의 폴더들이 동적으로 표시됩니다 -->
                                    <div class="add-button" onclick="createNewFolder()">+</div>
                    </div>
                </div>
                        
                        <!-- 휴지통 드롭 존 -->
                        <div class="trash-can-dropzone" 
                             ondragover="handleTrashDragOver(event)" 
                             ondrop="handleDropOnTrash(event)"
                             ondragleave="handleTrashDragLeave(event)">
                            <svg class="trash-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3,6 5,6 21,6"></polyline>
                                <path d="m19,6v14a2,2 0 0,1 -2,2H7a2,2 0 0,1 -2,-2V6m3,0V4a2,2 0 0,1 2,-2h4a2,2 0 0,1 2,2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                            <div class="trash-text">여기에 드롭하여<br>폴더 삭제</div>
            </div>
        </div>
    </div>

                    <!-- User Box (Right) -->
                    <div class="user-box">
                        <div class="profile-avatar"></div>
                        <div class="user-email">surim01@gmail.com</div>
                        <div class="user-role">Premium User</div>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-value folder-count">0</div>
                                <div class="stat-label">Folders</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value last-access-date">0</div>
                                <div class="stat-label">Days Ago</div>
                            </div>
                        </div>
                        <div class="user-actions">
                            <button class="logout-btn">Logout</button>
                            <button class="pdf-add-btn">PDF 추가</button>
                        </div>
                    </div>
                </div>

                <!-- Memo, Calendar and Quiz Mate Section -->
                <div class="memo-calendar-quizmate-section">
                    <div class="memo-calendar-quizmate-container">
                        <!-- Calendar Section -->
                        <div class="calendar-section">
                            <div class="calendar-header">
                                <div class="library-title-main">
                                    <div class="calendar-icon-main"></div>
                                    <span class="library-text">달력</span>
                                </div>
                                <div class="calendar-nav">
                                    <button class="calendar-nav-btn" id="prevMonth">‹</button>
                                    <span class="calendar-month-year" id="currentMonthYear"></span>
                                    <button class="calendar-nav-btn" id="nextMonth">›</button>
                                </div>
                            </div>
                            <div class="calendar-container">
                                <div class="calendar-grid" id="calendar-grid">
                                    <!-- 달력이 동적으로 생성됩니다 -->
                                </div>
                            </div>
                        </div>
                        
                        <!-- Todo List Wrapper -->
                        <div class="todo-card-wrapper">
                            <div class="todo-header">
                                <span class="todo-title">
                                    <div class="todo-icon"></div>
                                    Todo list
                                </span>
                                <button class="todo-add-btn" onclick="addNewTodo()" title="새 할 일 추가">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                        <circle cx="12" cy="12" r="10"/>
                                        <line x1="12" y1="8" x2="12" y2="16"/>
                                        <line x1="8" y1="12" x2="16" y2="12"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="todo-list-container">
                                <div id="todo-list">
                                    <!-- Todo items will be dynamically added here -->
                                </div>
                                <button class="add-todo-button" onclick="addNewTodo()">
                                    <span class="add-todo-plus">+</span>
                                    <span class="add-todo-text">새 할 일 추가</span>
                                </button>
                                <div class="todo-progress">
                                    <span class="progress-label">진행률</span>
                                    <div class="progress-bar">
                                        <div class="progress-fill" id="progress-fill"></div>
                                    </div>
                                    <span class="progress-percentage" id="progress-percentage">0%</span>
                                </div>
                            </div>
                        </div>

                        <!-- Banner Buttons Section -->
                        <div class="banner-buttons-section">
                            <!-- Quiz Mate Banner Button -->
                            <div class="quiz-mate-banner-button" onclick="openQuizMate()">
                                <img src="quiz mate btn.png" alt="Quiz Mate" class="banner-button-image">
                            </div>
                            
                            <!-- Second Brain Banner Button -->
                            <div class="second-brain-banner-button" onclick="openSecondBrain()">
                                <img src="second brain btn.png" alt="Second Brain" class="banner-button-image">
                        </div>
                        </div>
                    </div>
                </div>



                <!-- Graph Popup Modal -->
                <div class="graph-popup-overlay" id="graph-popup-overlay" style="display: none;" onclick="closeGraphPopup(event)">
                    <div class="graph-popup" id="graph-popup">
                        <button class="graph-popup-close" onclick="closeGraphPopup()" title="그래프 닫기">×</button>
                        <div class="graph-container" id="graph-container">
                            <div class="graph-loading" id="graph-loading">
                                <div class="loading-spinner"></div>
                                <p>그래프를 로딩 중...</p>
                            </div>
                            <svg id="graph-svg"></svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="home.js" defer></script>
</body>
</html>
